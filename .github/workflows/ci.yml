# Generated by preflight from ci/workflow.json: zig build plan -- --workflow .github/workflows/ci.yml
name: CI
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: fast, merge (the gate a landing passes) or release (the full matrix, nightly and before a cut)
        type: choice
        options: [fast, merge, release]
        default: fast
      status-only:
        description: Verify the recorded merge or release tier for this exact commit
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # One queue per pull request, per dispatched branch and per main status run; a newer
  # run replaces an older one of the same pull request or work branch, never main's.
  group: ci-${{ github.event_name == 'push' && format('main-status-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  gate:
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@8c363bb6b25cf05218899f5296bd47143f044b49
